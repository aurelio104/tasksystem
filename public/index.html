<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b8cce8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050508" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>TaskSystem</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-mesh" aria-hidden="true"></div>
    <div class="bg-noise" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="nav-bar glass">
        <div class="nav-leading">
          <span class="nav-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2L4 7v10l8 5 8-5V7l-8-5z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <div>
            <p class="nav-eyebrow">MD-80 · SEZ</p>
            <h1 class="nav-title">TaskSystem</h1>
          </div>
        </div>
        <div class="nav-trailing">
          <span class="pill pill-secondary" id="stat-total">—</span>
          <span class="pill pill-tint" id="stat-filtered">—</span>
        </div>
        <p class="nav-subtitle" id="meta-line">Cargando…</p>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <details class="glass-card filters-drawer" open>
            <summary class="filters-drawer-summary">
              <h2 class="section-title">Filtros</h2>
            </summary>

            <div class="filters-drawer-body">
              <div class="inset-group glass-inset">
                <label class="list-field">
                  <span class="field-label">Buscar</span>
                  <div class="search-wrap glass-inset">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
                      <path d="M16 16l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <input
                      type="search"
                      id="filter-q"
                      class="ios-input"
                      placeholder="Task card, AMM…"
                      enterkeyhint="search"
                    />
                  </div>
                </label>
              </div>

              <p class="group-caption">Intervalo</p>
              <div class="inset-group glass-inset">
                <label class="list-field compact">
                  <span class="field-label">Threshold</span>
                  <select id="filter-threshold" class="ios-select">
                    <option value="">Todos</option>
                  </select>
                </label>
                <div class="separator"></div>
                <label class="list-field compact">
                  <span class="field-label">Repeat</span>
                  <select id="filter-repeat" class="ios-select">
                    <option value="">Todos</option>
                  </select>
                </label>
              </div>

              <p class="group-caption">Ciclos</p>
              <div class="segmented" id="cycle-chips" role="group" aria-label="Ciclos rápidos"></div>

              <p class="group-caption">Aplicabilidad</p>
              <div class="inset-group glass-inset">
                <label class="list-field compact">
                  <span class="field-label">Source</span>
                  <select id="filter-source" class="ios-select">
                    <option value="">Todos</option>
                  </select>
                </label>
                <div class="separator"></div>
                <label class="list-field compact">
                  <span class="field-label">Airplane</span>
                  <select id="filter-airplane" class="ios-select">
                    <option value="">Todos</option>
                  </select>
                </label>
                <div class="separator"></div>
                <label class="list-field compact">
                  <span class="field-label">Engine</span>
                  <select id="filter-engine" class="ios-select">
                    <option value="">Todos</option>
                  </select>
                </label>
                <div class="separator"></div>
                <label class="list-field compact">
                  <span class="field-label">ATA</span>
                  <select id="filter-ata" class="ios-select">
                    <option value="">Todos</option>
                  </select>
                </label>
              </div>

              <p class="group-caption">Orden</p>
              <div class="inset-group glass-inset">
                <label class="list-field compact">
                  <span class="field-label">Listar por</span>
                  <select id="filter-sort" class="ios-select">
                    <option value="id-asc">Task card A→Z</option>
                    <option value="id-desc">Task card Z→A</option>
                    <option value="threshold">Threshold</option>
                    <option value="source">Source</option>
                  </select>
                </label>
              </div>

              <button type="button" class="btn-ios btn-secondary" id="btn-clear">
                Limpiar filtros
              </button>
            </div>
          </details>
        </aside>

        <section class="content-column">
          <details class="glass-card panel-drawer results-drawer">
            <summary class="panel-drawer-summary">
              <h2 class="section-title">Resultados</h2>
              <span class="pill pill-count" id="results-count">0</span>
            </summary>
            <div class="panel-drawer-body results-drawer-body">
              <div class="search-wrap search-compact glass-inset">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M16 16l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input
                  type="search"
                  id="results-filter-q"
                  class="ios-input"
                  placeholder="Filtrar en resultados…"
                  enterkeyhint="search"
                />
              </div>
              <div class="results-filter-grid">
                <label class="mini-field">
                  <span>Threshold</span>
                  <select id="results-filter-threshold" class="ios-select mini-select"><option value="">Todos</option></select>
                </label>
                <label class="mini-field">
                  <span>Repeat</span>
                  <select id="results-filter-repeat" class="ios-select mini-select"><option value="">Todos</option></select>
                </label>
                <label class="mini-field">
                  <span>Source</span>
                  <select id="results-filter-source" class="ios-select mini-select"><option value="">Todos</option></select>
                </label>
                <label class="mini-field">
                  <span>ATA</span>
                  <select id="results-filter-ata" class="ios-select mini-select"><option value="">Todos</option></select>
                </label>
                <label class="mini-field">
                  <span>Orden</span>
                  <select id="results-sort" class="ios-select mini-select">
                    <option value="id-asc">Task card A→Z</option>
                    <option value="id-desc">Task card Z→A</option>
                    <option value="threshold">Threshold</option>
                    <option value="source">Source</option>
                  </select>
                </label>
              </div>
              <div class="segmented segmented-compact" id="results-cycle-chips" role="group" aria-label="Ciclos en resultados"></div>
              <div class="active-filters" id="active-filters" hidden></div>
            </div>
          </details>

          <details class="glass-card panel-drawer print-drawer" id="print-panel" hidden>
            <summary class="panel-drawer-summary">
              <h2 class="section-title">Impresión</h2>
              <span class="pill pill-tint print-summary-pill" id="print-summary-pill">0/0</span>
            </summary>
            <div class="panel-drawer-body print-drawer-body">
              <div class="print-bar">
                <div class="print-bar-row">
                  <span class="print-bar-count" id="print-selected-count" title="Seleccionadas para PDF">0/0</span>
                  <span class="print-bar-stats">
                    <span class="stat-in" title="Incluidas"><span id="count-included">0</span>✓</span>
                    <span class="stat-out" title="Excluidas"><span id="count-excluded">0</span>✗</span>
                  </span>
                  <div class="print-view-tabs segmented segmented-mini" role="tablist" aria-label="Vista de selección">
                    <button type="button" class="seg-btn active" data-print-view="all" role="tab">Todas</button>
                    <button type="button" class="seg-btn" data-print-view="included" role="tab">Inc.</button>
                    <button type="button" class="seg-btn" data-print-view="excluded" role="tab">Exc.</button>
                  </div>
                  <div class="print-bar-actions">
                    <button type="button" class="btn-ios btn-secondary btn-mini" id="btn-select-all" title="Marcar todas">Todas</button>
                    <button type="button" class="btn-ios btn-secondary btn-mini" id="btn-select-none" title="Desmarcar todas">Ninguna</button>
                    <button type="button" class="btn-ios btn-tint btn-mini" id="btn-export-pdf">PDF</button>
                  </div>
                </div>
                <p class="print-status print-status-inline" id="print-status" hidden></p>
              </div>
            </div>
          </details>

          <div class="list-scroll glass-card" id="list-scroll">
            <div class="list-scroll-header">
              <span class="list-title">Task cards</span>
              <span class="list-view-hint" id="list-view-hint"></span>
            </div>
            <ul class="ios-list cards-grid" id="cards-body" role="list"></ul>
            <p class="list-empty hidden" id="list-empty">Sin resultados en esta vista</p>
          </div>
        </section>

        <section class="pdf-column">
          <div class="glass-card pdf-card">
            <div class="pdf-header">
              <div class="pdf-header-titles">
                <h2 class="section-title">Tarjeta</h2>
                <p class="pdf-card-label" id="pdf-card-label">—</p>
                <p class="pdf-nav-mode" id="pdf-nav-mode"></p>
              </div>
              <div class="pdf-toolbar-ios">
                <button type="button" class="icon-btn" id="pdf-prev" aria-label="Página anterior">
                  <svg width="18" height="18" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <div class="page-stepper">
                  <input type="number" id="pdf-page" min="1" value="1" class="page-input" aria-label="Página" />
                  <span class="page-total" id="pdf-pages">/ —</span>
                </div>
                <button type="button" class="icon-btn" id="pdf-next" aria-label="Página siguiente">
                  <svg width="18" height="18" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <button type="button" class="btn-ios btn-secondary btn-compact" id="pdf-index" title="Ir al índice del manual">Índice</button>
              </div>
            </div>
            <div class="pdf-stage" id="pdf-viewport">
              <canvas id="pdf-canvas"></canvas>
              <div class="pdf-shimmer" id="pdf-loading">
                <span class="spinner"></span>
                <span>Cargando PDF…</span>
              </div>
            </div>
          </div>

          <details class="glass-card detail-sheet" id="card-detail" hidden>
            <summary class="detail-summary">
              <span id="detail-title">Detalle</span>
              <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
              </svg>
            </summary>
            <dl class="detail-grid" id="detail-body"></dl>
          </details>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
